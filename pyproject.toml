[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "acslagent-reproduction"
version = "0.1.0"
description = "Module-by-module, behavior-checked LangGraph reproduction of ACSLAgent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain-core==1.7.4",
    "langgraph==1.2.19",
    "langgraph-checkpoint-sqlite==3.1.3",
    "openai==1.82.1",
    "PyYAML==6.0.3",
]

[project.scripts]
acslagent = "acslagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/acslagent"]

