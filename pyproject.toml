[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "acslagent-reproduction"
version = "0.2.0"
description = "ACSLAgent Improve: configurable candidate WP ranking and per-subtask counterexample repair"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain-core==1.7.4",
    "langgraph==1.2.19",
    "langgraph-checkpoint-sqlite==3.1.3",
    "openai==1.82.1",
    "PyYAML==6.0.3",
]

[project.scripts]
acslagent = "acslagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/acslagent"]


# Validated native versions, installed with the README commands (not by pip).
[tool.acslagent.native]
frama-c = "33.0"
ocaml = "4.14.2"
why3 = "1.8.2"
alt-ergo-free = "2.4.3"
z3 = "4.13.3"
llvm = "12.0.1"
